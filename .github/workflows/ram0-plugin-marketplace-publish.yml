name: Publish Ram0 Plugin Marketplace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source

      - name: Check out distribution repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: olhapi/ram0-plugins
          token: ${{ secrets.RAM0_MARKETPLACE_TOKEN }}
          path: distribution
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify exporter and publisher contracts
        run: |
          python -m pip install pytest
          python -m pytest \
            source/integrations/ram0-plugin/tests/test_export_marketplace.py \
            source/integrations/ram0-plugin/tests/test_publish_marketplace.py \
            -q

      - name: Publish generated marketplace
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git -C distribution config user.name "ram0-marketplace[bot]"
          git -C distribution config user.email "ram0-marketplace[bot]@users.noreply.github.com"
          git -C distribution config commit.gpgsign false
          python source/integrations/ram0-plugin/scripts/publish_marketplace.py \
            --destination "$PWD/distribution" \
            --source-commit "$SOURCE_COMMIT" \
            --expected-remote 'https://github.com/olhapi/ram0-plugins.git' \
            --expected-branch main \
            --publish
