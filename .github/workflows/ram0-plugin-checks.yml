name: Ram0 Plugin Checks

# On PRs this is invoked by ci-gate.yml (the single required check);
# push-to-main and manual runs remain standalone.
#
# Covers the Python hooks and tests. The nested OpenCode package is checked by
# ram0-opencode-plugin-checks.yml.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'integrations/ram0-plugin/**'
      - '!integrations/ram0-plugin/.opencode-plugin/**'
      - '.github/workflows/ram0-plugin-checks.yml'
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: integrations/ram0-plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Verify hook entry points are executable
        working-directory: integrations/ram0-plugin
        run: |
          missing=$(find scripts -name '*.sh' ! -name '_*' ! -perm -u+x -print)
          if [ -n "$missing" ]; then
            echo "Hook entry points must be executable:"
            echo "$missing"
            exit 1
          fi

      - name: Check manifests are valid JSON
        working-directory: integrations/ram0-plugin
        run: |
          for f in plugin.json mcp_config.json .mcp.json .codex-mcp.json .cursor-mcp.json \
            .claude-plugin/plugin.json .codex-plugin/plugin.json .cursor-plugin/plugin.json hooks/*.json; do
            jq empty "$f" || (echo "Invalid JSON: $f" && exit 1)
          done

      - name: Run tests
        working-directory: integrations/ram0-plugin
        run: python -m pytest -q

      - name: Verify deterministic marketplace export
        run: |
          output_one="$(mktemp -d)"
          output_two="$(mktemp -d)"
          source_commit="$(git rev-parse HEAD)"
          python integrations/ram0-plugin/scripts/export_marketplace.py --output "$output_one" --source-commit "$source_commit"
          python integrations/ram0-plugin/scripts/export_marketplace.py --output "$output_two" --source-commit "$source_commit"
          diff -ru "$output_one" "$output_two"
